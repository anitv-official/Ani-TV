name: Publish AniTV v1.3.0

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.29.3'
  RELEASE_SHA: '4143daf170b169ff31e7002f659d901b47c9da44'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/anitv-release.jks"
          chmod 600 "$GITHUB_WORKSPACE/anitv-release.jks"
          {
            printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/anitv-release.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/key.properties

      - name: Build signed universal APK
        run: >-
          flutter build apk --release
          --dart-define=ANITV_FCM_PROVIDER_ID=6aa7e29d002c93304bf6
          --dart-define=ANITV_FCM_TOPIC_ID=6aa7e2fa002c5c5a4d8b

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk anitv-v1.3.0.apk
          gh release create v1.3.0 anitv-v1.3.0.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "AniTV 1.3.0" \
            --notes "تحسينات واجهة التطبيق، إصلاحات التشغيل والمصادر، وتحسينات الحسابات والملف الشخصي."

      - name: Remove release signing material
        if: ${{ always() }}
        run: rm -f "$GITHUB_WORKSPACE/anitv-release.jks" android/key.properties
