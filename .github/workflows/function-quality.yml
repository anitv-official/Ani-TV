name: Function Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  username-login-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appwrite-functions/username-login
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: appwrite-functions/username-login/package-lock.json

      - name: Install function dependencies
        run: npm ci --ignore-scripts

      - name: Check function syntax
        run: node --check src/main.js

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  news-engine-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appwrite-functions/news-engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check News Engine syntax
        run: node --check index.js

      - name: Run News Engine unit tests
        run: node --test index.test.js

  community-media-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Check Community media functions
        run: |
          deno check community-media-upload/index.ts
          deno check community-media-complete/index.ts
          deno check community-media-url/index.ts
          deno check community-media-delete/index.ts
          deno check community-write/index.ts

      - name: Check no B2 credentials are committed
        run: |
          ! grep -R -n -E 'B2_APPLICATION_KEY=[^$]|B2_KEY_ID=[^$]|SUPABASE_SERVICE_ROLE_KEY=[^$]' .

  favorite-notifications-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appwrite-functions/anitv-notifications
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: appwrite-functions/anitv-notifications/package-lock.json
      - name: Install function dependencies
        run: npm ci --ignore-scripts
      - name: Run Favorite Notifications tests
        run: npm test
      - name: Check function syntax
        run: node --check src/main.js
