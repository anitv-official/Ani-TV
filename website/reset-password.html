<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090909" />
  <title>Reset Password — AniTV</title>
  <link rel="icon" href="/assets/anitv_app_icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="auth-page">
  <div class="orb orb-a"></div><div class="orb orb-b"></div>
  <header class="nav">
    <a class="brand" href="/"><img src="/assets/anitv_app_icon.png" alt="AniTV logo" /><span>Ani<span>TV</span></span></a>
    <nav><a href="/">Home</a><a href="/download">Download</a><a href="/privacy">Privacy</a></nav>
  </header>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="page-title">
      <p class="eyebrow">AniTV account</p>
      <h1 id="page-title">Reset Password</h1>
      <p id="intro" class="auth-lede">Enter your email and we’ll send you a secure password recovery link.</p>
      <div id="status" class="status" role="status" aria-live="polite" hidden></div>

      <form id="request-form" novalidate>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
        <button class="button primary auth-submit" type="submit"><span class="button-label">Send recovery link</span><span class="button-loading" hidden>Sending…</span></button>
      </form>

      <form id="recovery-form" novalidate hidden>
        <label for="password">New Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required />
        <label for="confirm-password">Confirm Password</label>
        <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" placeholder="Repeat your password" required />
        <button class="button primary auth-submit" type="submit"><span class="button-label">Reset Password</span><span class="button-loading" hidden>Updating…</span></button>
      </form>

      <a id="login-link" class="button secondary auth-submit" href="/download" hidden>Return to AniTV</a>
      <p class="auth-note">Your password is sent directly to AniTV’s authentication service. It is never stored on this website.</p>
    </section>
  </main>
  <script type="module">
    import { Client, Account } from 'https://cdn.jsdelivr.net/npm/appwrite@17.0.0/+esm';

    const RECOVERY_URL = 'https://anitv-tau.vercel.app/reset-password';
    const client = new Client().setEndpoint('https://nyc.cloud.appwrite.io/v1').setProject('6aa4295900094d600163');
    const account = new Account(client);
    const params = new URLSearchParams(`${window.location.search}${window.location.hash.replace(/^#/, '&')}`);
    const userId = params.get('userId') || '';
    const secret = params.get('secret') || '';
    const requestForm = document.getElementById('request-form');
    const recoveryForm = document.getElementById('recovery-form');
    const status = document.getElementById('status');
    const intro = document.getElementById('intro');
    const loginLink = document.getElementById('login-link');

    function showStatus(message, type = 'error') {
      status.textContent = message;
      status.className = `status ${type}`;
      status.hidden = false;
    }
    function setLoading(form, loading) {
      form.querySelector('.button-label').hidden = loading;
      form.querySelector('.button-loading').hidden = !loading;
      form.querySelector('button').disabled = loading;
    }
    function genericError() { return 'Unable to complete the request. Please try again.'; }

    if (userId && secret) {
      requestForm.hidden = true;
      recoveryForm.hidden = false;
      intro.textContent = 'Choose a new password for your AniTV account.';
    }

    requestForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email || !email.includes('@')) {
        showStatus('Please enter a valid email address.');
        return;
      }
      setLoading(requestForm, true);
      status.hidden = true;
      try {
        await account.createRecovery(email, RECOVERY_URL);
        showStatus('If an account exists for this email, a recovery link has been sent.', 'success');
        requestForm.reset();
      } catch (_) {
        showStatus('Unable to send the recovery link. Please try again.');
      } finally {
        setLoading(requestForm, false);
      }
    });

    recoveryForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm-password').value;
      if (password.length < 8) {
        showStatus('Your password must be at least 8 characters.');
        return;
      }
      if (password !== confirm) {
        showStatus('The passwords do not match.');
        return;
      }
      setLoading(recoveryForm, true);
      status.hidden = true;
      try {
        await account.updateRecovery(userId, secret, password);
        recoveryForm.hidden = true;
        intro.textContent = 'Your password has been updated successfully.';
        showStatus('Password reset complete. You can now sign in to AniTV.', 'success');
        loginLink.hidden = false;
      } catch (_) {
        showStatus('This recovery link is invalid or has expired. Please request a new one.');
      } finally {
        setLoading(recoveryForm, false);
      }
    });
  </script>
</body>
</html>
