<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090909" />
  <title>استعادة كلمة المرور — AniTV</title>
  <link rel="icon" href="https://raw.githubusercontent.com/anitv-official/Ani-TV/main/website/assets/anitv_app_icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="auth-page">
  <div class="orb orb-a"></div><div class="orb orb-b"></div>
  <header class="nav">
    <a class="brand" href="/"><img src="https://raw.githubusercontent.com/anitv-official/Ani-TV/main/website/assets/anitv_app_icon.png" alt="شعار AniTV" /><span>Ani<span>TV</span></span></a>
    <nav><a href="/">الرئيسية</a><a href="/download">التحميل</a><a href="/privacy">الخصوصية</a></nav>
  </header>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="page-title">
      <p class="eyebrow">حساب AniTV</p>
      <h1 id="page-title">استعادة كلمة المرور</h1>
      <p id="intro" class="auth-lede">أدخل بريدك الإلكتروني وسنرسل إليك رابطًا آمنًا لاستعادة كلمة المرور.</p>
      <div id="status" class="status" role="status" aria-live="polite" hidden></div>

      <form id="request-form" novalidate>
        <label for="email">البريد الإلكتروني</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
        <button class="button primary auth-submit" type="submit"><span class="button-label">إرسال رابط الاستعادة</span><span class="button-loading" hidden>جارٍ الإرسال…</span></button>
      </form>

      <form id="recovery-form" novalidate hidden>
        <label for="password">كلمة المرور الجديدة</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="8 أحرف على الأقل" required />
        <label for="confirm-password">تأكيد كلمة المرور</label>
        <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" placeholder="أعد كتابة كلمة المرور" required />
        <button class="button primary auth-submit" type="submit"><span class="button-label">تغيير كلمة المرور</span><span class="button-loading" hidden>جارٍ التحديث…</span></button>
      </form>

      <a id="login-link" class="button secondary auth-submit" href="/download" hidden>العودة إلى AniTV</a>
      <p class="auth-note">تُرسل كلمة المرور مباشرةً إلى خدمة المصادقة الخاصة بـ AniTV، ولا يتم تخزينها على هذا الموقع.</p>
    </section>
  </main>
  <script type="module">
    import { Client, Account } from 'https://cdn.jsdelivr.net/npm/appwrite@17.0.0/+esm';

    const RECOVERY_URL = 'https://anitv-tau.vercel.app/reset-password';
    const client = new Client().setEndpoint('https://nyc.cloud.appwrite.io/v1').setProject('6aa4295900094d600163');
    const account = new Account(client);
    const params = new URLSearchParams(`${window.location.search}${window.location.hash.replace(/^#/, '&')}`);
    const userId = params.get('userId') || '';
    const secret = params.get('secret') || '';
    const requestForm = document.getElementById('request-form');
    const recoveryForm = document.getElementById('recovery-form');
    const status = document.getElementById('status');
    const intro = document.getElementById('intro');
    const loginLink = document.getElementById('login-link');

    function showStatus(message, type = 'error') {
      status.textContent = message;
      status.className = `status ${type}`;
      status.hidden = false;
    }
    function setLoading(form, loading) {
      form.querySelector('.button-label').hidden = loading;
      form.querySelector('.button-loading').hidden = !loading;
      form.querySelector('button').disabled = loading;
    }
    if (userId && secret) {
      requestForm.hidden = true;
      recoveryForm.hidden = false;
      intro.textContent = 'اختر كلمة مرور جديدة لحسابك في AniTV.';
    }

    requestForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email || !email.includes('@')) {
        showStatus('يرجى إدخال بريد إلكتروني صالح.');
        return;
      }
      setLoading(requestForm, true);
      status.hidden = true;
      try {
        await account.createRecovery(email, RECOVERY_URL);
        showStatus('إذا كان هناك حساب مرتبط بهذا البريد، فسيتم إرسال رابط الاستعادة إليه.', 'success');
        requestForm.reset();
      } catch (_) {
        showStatus('تعذر إرسال رابط الاستعادة. يرجى المحاولة مرة أخرى.');
      } finally {
        setLoading(requestForm, false);
      }
    });

    recoveryForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm-password').value;
      if (password.length < 8) {
        showStatus('يجب أن تتكون كلمة المرور من 8 أحرف على الأقل.');
        return;
      }
      if (password !== confirm) {
        showStatus('كلمتا المرور غير متطابقتين.');
        return;
      }
      setLoading(recoveryForm, true);
      status.hidden = true;
      try {
        await account.updateRecovery(userId, secret, password);
        recoveryForm.hidden = true;
        intro.textContent = 'تم تحديث كلمة المرور بنجاح.';
        showStatus('اكتملت استعادة كلمة المرور. يمكنك الآن تسجيل الدخول إلى AniTV.', 'success');
        loginLink.hidden = false;
      } catch (_) {
        showStatus('رابط الاستعادة غير صالح أو انتهت صلاحيته. يرجى طلب رابط جديد.');
      } finally {
        setLoading(recoveryForm, false);
      }
    });
  </script>
</body>
</html>
